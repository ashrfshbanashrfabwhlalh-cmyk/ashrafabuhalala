<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أشرف أبوحلالة</title>
    <!-- استدعاء خطوط عربية كلاسيكية وأنيقة -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f7f5f0;        /* خلفية هادئة كلاسيكية */
            --card-bg: #ffffff;          /* خلفية البطاقة بيضاء */
            --primary-text: #2c2c2c;     /* لون النصوص */
            --accent-color: #8c6d46;    /* لون ذهبي كلاسيكي */
            --hover-color: #6f5433;     /* لون التفاعل */
            --border-color: #e2dbce;    /* لون الحدود */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Amiri', serif;
            background-color: var(--bg-color);
            color: var(--primary-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            max-width: 450px;
            width: 100%;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            border-radius: 6px;
            position: relative;
        }

        /* إطار زخرفي كلاسيكي */
        .container::before {
            content: "";
            position: absolute;
            top: 8px;
            bottom: 8px;
            left: 8px;
            right: 8px;
            border: 1px solid var(--border-color);
            pointer-events: none;
            border-radius: 4px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 2px solid var(--accent-color);
            padding: 4px;
            background-color: #fff;
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--primary-text);
        }

        .subtitle {
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 12px;
            font-weight: 600;
        }

        /* النبذة التعريفية */
        .bio {
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            color: #555;
            line-height: 1.6;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            z-index: 1;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            background-color: #faf8f5;
            border: 1px solid var(--border-color);
            color: var(--primary-text);
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .link-item .icon-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-item i.social-icon {
            font-size: 1.3rem;
            width: 25px;
            color: var(--accent-color);
            transition: color 0.3s ease;
        }

        .link-item:hover {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(140, 109, 70, 0.2);
        }

        .link-item:hover i {
            color: #ffffff;
        }

        .arrow-icon {
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .footer {
            margin-top: 35px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.8rem;
            color: #999;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 18px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الصورة الشخصية -->
        <img src="https://i.ibb.co/YB28LR5h/image.jpg" alt="أشرف أبوحلالة" class="avatar">

        <!-- الاسم والصفة -->
        <h1>أشرف أبوحلالة</h1>
        <p class="subtitle">طالب إعلام وصانع محتوى</p>
        
        <!-- النبذة التعريفية الرسمية -->
        <p class="bio">
            أنا أشرف أبوحلالة، طالب في كلية الإعلام وشغوف بصناعة المحتوى الرقمي، الصحافة، وسرد القصص المؤثرة. أطمح إلى ترك بصمة إيجابية في عالم الإعلام الحديث.
        </p>

        <!-- روابط التواصل الاجتماعي -->
        <div class="links-container">

            <!-- فيسبوك -->
            <a href="https://www.facebook.com/ashrafabuhalala" target="_blank" class="link-item">
                <div class="icon-wrapper">
                    <i class="fab fa-facebook-f social-icon"></i>
                    <span>فيسبوك</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>

            <!-- انستقرام -->
            <a href="https://www.instagram.com/3xcol._?igsi=MTljNTJpYWpkeGl5YQ==" target="_blank" class="link-item">
                <div class="icon-wrapper">
                    <i class="fab fa-instagram social-icon"></i>
                    <span>انستقرام</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>

            <!-- سناب شات -->
            <a href="https://www.snapchat.com/add/ii4on3?share_id=vxHMlI4Eco8&locale=ar-EG-u-nu-latn" target="_blank" class="link-item">
                <div class="icon-wrapper">
                    <i class="fab fa-snapchat social-icon"></i>
                    <span>سناب شات</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>

            <!-- واتساب -->
            <a href="https://wa.me/218923853295" target="_blank" class="link-item">
                <div class="icon-wrapper">
                    <i class="fab fa-whatsapp social-icon"></i>
                    <span>واتساب</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>

        </div>

        <!-- الحقوق -->
        <div class="footer">
            <p>© جميع الحقوق محفوظة - أشرف أبوحلالة</p>
        </div>
    </div>

</body>
  </html>
